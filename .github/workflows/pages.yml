# Publishes the existing static web app (web-app/) to GitHub Pages, so the supervisor dashboard
# is reachable at <pages-url>/#/dashboard. Deployment only: no build step and no dependencies.
# The site shows the seeded demo workers; it does not sync with phones (docs/17_DEPLOYMENT.md).
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-app/index.html'
      - 'web-app/sw.js'
      - 'web-app/css/**'
      - 'web-app/js/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Same file set the Android build packages (android-shell/app/build.gradle, copyWebApp):
      # no tests, tools, package files or node_modules.
      - name: Stage static web app
        run: |
          mkdir -p _site
          cp -r web-app/index.html web-app/sw.js web-app/css web-app/js _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
