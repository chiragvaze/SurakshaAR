pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// The Unity AR trainer, exported by unity-ar (menu SurakshaAR > 4. Export Android Library,
// or `unity-ar/build.sh export`). It is a build artifact and is not committed.
def unityExport = new File(settingsDir, '../unity-ar/Builds/AndroidExport')
def unityLibraryDir = new File(unityExport, 'unityLibrary')

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        flatDir { dirs new File(unityLibraryDir, 'libs') }
    }
}

rootProject.name = 'SurakshaAR'
include ':app'
include ':unityLibrary'
project(':unityLibrary').projectDir = unityLibraryDir

// Nested Android library modules generated by Unity (same as the export's own settings.gradle).
include ':unityLibrary:xrmanifest.androidlib'
project(':unityLibrary:xrmanifest.androidlib').projectDir = new File(unityLibraryDir, 'xrmanifest.androidlib')
include ':unityLibrary:SurakshaQueries.androidlib'
project(':unityLibrary:SurakshaQueries.androidlib').projectDir = new File(unityLibraryDir, 'SurakshaQueries.androidlib')
