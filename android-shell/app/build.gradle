plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.surakshaar.shell'
    // Same compile SDK as the exported Unity library (installed with Unity's Android support).
    compileSdk 36
    buildToolsVersion '34.0.0'   // the build-tools installed with Unity (AGP 7.4 would default to 30.0.3)

    defaultConfig {
        applicationId 'com.surakshaar.app'
        minSdk 29
        targetSdk 34
        versionCode 6
        versionName '0.6.0-sat'
        ndk { abiFilters 'arm64-v8a' }
    }

    // Local release key (P3-M2): -PsurakshaarSigning=<keystore.properties outside the repo> with
    // storeFile (relative to that file), storePassword, keyAlias, keyPassword. Never commit these.
    // Without it, release falls back to the debug key as before (D-031). Not a store/production key.
    def signingPropsPath = project.findProperty('surakshaarSigning')
    signingConfigs {
        if (signingPropsPath) {
            def propsFile = file(signingPropsPath)
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }
            release {
                def ks = new File(props.getProperty('storeFile'))
                storeFile ks.isAbsolute() ? ks : new File(propsFile.parentFile, props.getProperty('storeFile'))
                storeType 'pkcs12'
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias')
                keyPassword props.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingPropsPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }

    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/webassets"
    }

    // Same as Unity's exported launcher: keep Unity data files uncompressed. '.ogg' (Santali voice
    // clips) stays uncompressed so the AR trainer can stream it with AssetManager.openFd().
    aaptOptions {
        noCompress = ['.unity3d', '.ress', '.resource', '.obb', '.bundle', '.unityexp', '.ogg'] + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    packagingOptions {
        doNotStrip '*/arm64-v8a/*.so'   // Unity ships its own stripped native libraries
        jniLibs { useLegacyPackaging true }
    }
}

// Copy the unchanged Phase 1 web app into assets/web (single source of truth: ../web-app).
tasks.register('copyWebApp', Sync) {   // Sync: files deleted from web-app are removed from the APK too
    from("$rootDir/../web-app") {
        include 'index.html', 'sw.js', 'css/**', 'js/**', 'audio/**/*.ogg'
    }
    into "$buildDir/generated/webassets/web"
}
preBuild.dependsOn 'copyWebApp'

dependencies {
    implementation project(':unityLibrary')
    implementation fileTree(dir: project(':unityLibrary').getProjectDir().toString() + '/libs', include: ['*.jar'])
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.webkit:webkit:1.7.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
